[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.7.0"
description = "Semantic recommendation & ranking engine (MovieLens 32M + TMDB): embeddings, FAISS, LightGBM"
requires-python = ">=3.10"
# Dependencies are pinned loosely in requirements.txt (install that first).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
